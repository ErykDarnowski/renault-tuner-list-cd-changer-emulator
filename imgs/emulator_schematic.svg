<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    svg { --fg:#1f2937; --muted:#4b5563; --bg:#ffffff; --box:#E1F5EE; --boxs:#0F6E56; --boxt:#04342C; --boxst:#0F6E56; }
    @media (prefers-color-scheme: dark) {
      svg { --fg:#e5e7eb; --muted:#9ca3af; --bg:#0d1117; --box:#0F5A47; --boxs:#5DCAA5; --boxt:#E1F5EE; --boxst:#9FE1CB; }
    }
    .bg { fill: var(--bg); }
    .w { fill: none; stroke: var(--fg); stroke-width: 1; }
    .dot { fill: var(--fg); }
    .h { font-size: 14px; font-weight: 600; fill: var(--fg); }
    .s { font-size: 12px; fill: var(--fg); }
    .n { font-size: 12px; fill: var(--muted); }
    .box { fill: var(--box); stroke: var(--boxs); stroke-width: 0.75; }
    .bh { font-size: 14px; font-weight: 600; fill: var(--boxt); }
    .bs { font-size: 12px; fill: var(--boxst); }
  </style>

  <rect class="bg" width="680" height="610"/>

  <!-- POWER -->
  <text class="h" x="40" y="28">Power</text>
  <text class="s" x="40" y="60" dominant-baseline="central">Pin 17 radio on</text>
  <line class="w" x1="150" y1="60" x2="230" y2="60"/>
  <rect class="w" x="230" y="54" width="50" height="12"/>
  <text class="s" x="255" y="44" text-anchor="middle" dominant-baseline="central">R8  100 kΩ</text>
  <line class="w" x1="280" y1="60" x2="460" y2="60"/>
  <line class="w" x1="460" y1="60" x2="460" y2="80"/>

  <text class="s" x="40" y="110" dominant-baseline="central">Pin 16 +12 V</text>
  <line class="w" x1="130" y1="110" x2="180" y2="110"/>
  <rect class="w" x="180" y="104" width="40" height="12"/>
  <text class="s" x="200" y="94" text-anchor="middle" dominant-baseline="central">F1  1 A</text>
  <line class="w" x1="220" y1="110" x2="390" y2="110"/>
  <circle class="dot" cx="250" cy="110" r="3"/>
  <circle class="dot" cx="310" cy="110" r="3"/>

  <line class="w" x1="250" y1="110" x2="250" y2="125"/>
  <rect class="w" x="243" y="125" width="14" height="20"/>
  <text class="s" x="264" y="135" dominant-baseline="central">TVS</text>
  <line class="w" x1="250" y1="145" x2="250" y2="160"/>
  <path class="w" d="M242 160H258M245 164H255M248 168H252"/>

  <line class="w" x1="310" y1="110" x2="310" y2="130"/>
  <path class="w" d="M302 130H318M302 136H318"/>
  <line class="w" x1="310" y1="136" x2="310" y2="160"/>
  <path class="w" d="M302 160H318M305 164H315M308 168H312"/>
  <text class="s" x="318" y="148" dominant-baseline="central">C4  100 µF</text>

  <rect class="box" x="390" y="80" width="140" height="70" rx="6"/>
  <text class="bs" x="460" y="92" text-anchor="middle" dominant-baseline="central">EN</text>
  <text class="bs" x="396" y="110" dominant-baseline="central">IN+</text>
  <text class="bs" x="524" y="110" text-anchor="end" dominant-baseline="central">VO+</text>
  <text class="bh" x="460" y="116" text-anchor="middle" dominant-baseline="central">HW-613</text>
  <text class="bs" x="460" y="136" text-anchor="middle" dominant-baseline="central">set to 3.3 V</text>
  <line class="w" x1="530" y1="110" x2="590" y2="110"/>
  <text class="s" x="596" y="110" dominant-baseline="central">ESP32 3V3</text>
  <line class="w" x1="460" y1="150" x2="460" y2="165"/>
  <path class="w" d="M452 165H468M455 169H465M458 173H462"/>

  <!-- DATA LINES -->
  <text class="h" x="40" y="210">Data lines</text>

  <text class="s" x="40" y="325" dominant-baseline="central">ESP32 GPIO15</text>
  <line class="w" x1="130" y1="325" x2="160" y2="325"/>
  <rect class="w" x="160" y="319" width="50" height="12"/>
  <text class="s" x="185" y="307" text-anchor="middle" dominant-baseline="central">R5  100 Ω</text>
  <line class="w" x1="210" y1="325" x2="250" y2="325"/>
  <rect class="box" x="250" y="300" width="60" height="50" rx="6"/>
  <text class="bh" x="280" y="317" text-anchor="middle" dominant-baseline="central">Q1</text>
  <text class="bs" x="280" y="336" text-anchor="middle" dominant-baseline="central">2N7000</text>
  <path class="w" d="M280 300V270H330"/>
  <text class="s" x="336" y="270" dominant-baseline="central">Pin 14 Rx</text>
  <line class="w" x1="280" y1="350" x2="280" y2="372"/>
  <path class="w" d="M272 372H288M275 376H285M278 380H282"/>

  <text class="s" x="362" y="325" dominant-baseline="central">Pin 13 Tx</text>
  <line class="w" x1="430" y1="325" x2="480" y2="325"/>
  <rect class="box" x="480" y="300" width="60" height="50" rx="6"/>
  <text class="bh" x="510" y="317" text-anchor="middle" dominant-baseline="central">Q2</text>
  <text class="bs" x="510" y="336" text-anchor="middle" dominant-baseline="central">2N7000</text>
  <line class="w" x1="510" y1="300" x2="510" y2="262"/>
  <circle class="dot" cx="510" cy="270" r="3"/>
  <rect class="w" x="504" y="234" width="12" height="28"/>
  <text class="s" x="496" y="248" text-anchor="end" dominant-baseline="central">R7  47 kΩ</text>
  <line class="w" x1="510" y1="234" x2="510" y2="228"/>
  <text class="s" x="510" y="220" text-anchor="middle" dominant-baseline="central">ESP32 3V3</text>
  <line class="w" x1="510" y1="270" x2="545" y2="270"/>
  <rect class="w" x="545" y="264" width="40" height="12"/>
  <text class="s" x="565" y="252" text-anchor="middle" dominant-baseline="central">R6  1 kΩ</text>
  <line class="w" x1="585" y1="270" x2="600" y2="270"/>
  <text class="s" x="604" y="270" dominant-baseline="central">GPIO16</text>
  <line class="w" x1="510" y1="350" x2="510" y2="372"/>
  <path class="w" d="M502 372H518M505 376H515M508 380H512"/>

  <!-- SPDIF -->
  <text class="h" x="40" y="420">SPDIF</text>
  <text class="s" x="40" y="470" dominant-baseline="central">ESP32 GPIO22</text>
  <line class="w" x1="130" y1="470" x2="172" y2="470"/>
  <path class="w" d="M172 462V478M178 462V478"/>
  <text class="s" x="175" y="450" text-anchor="middle" dominant-baseline="central">C5  100 nF</text>
  <line class="w" x1="178" y1="470" x2="230" y2="470"/>
  <rect class="w" x="230" y="464" width="50" height="12"/>
  <text class="s" x="255" y="450" text-anchor="middle" dominant-baseline="central">R3  330 Ω</text>
  <line class="w" x1="280" y1="470" x2="420" y2="470"/>
  <circle class="dot" cx="340" cy="470" r="3"/>
  <text class="s" x="426" y="470" dominant-baseline="central">Pin 18 SPDIF</text>
  <line class="w" x1="340" y1="470" x2="340" y2="490"/>
  <rect class="w" x="334" y="490" width="12" height="30"/>
  <text class="s" x="354" y="505" dominant-baseline="central">R4  100 Ω</text>
  <line class="w" x1="340" y1="520" x2="340" y2="540"/>
  <path class="w" d="M332 540H348M335 544H345M338 548H342"/>

  <text class="n" x="340" y="592" text-anchor="middle" dominant-baseline="central">All ground symbols join: ESP32 GND and plug pins 15, 19 and 20</text>
</svg>
